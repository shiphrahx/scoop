name: CI

on:
  # Every branch, not just main. The pre-push hook covers most of this locally,
  # but it cannot run the RLS suite — that needs a real Postgres, which only
  # exists here.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A branch only needs its newest push checked; supersede the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Now that push covers every branch, a pull request from this repo would be
    # checked twice over. Keep the pull_request trigger only for forks, whose
    # pushes never reach us.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository

    # The RLS suite runs the real migrations against a real Postgres and checks
    # one user cannot reach another's rows. Without a database it skips, so it
    # has to be here or it never runs at all.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scoop_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same script the pre-push hook runs: lint, typecheck, tests under the
      # coverage ratchet (see vitest.config.ts), then a build — nothing else
      # proves the app still compiles, since a type error inside a server
      # component never shows up in the unit tests. One script so that "it
      # passed locally" and "it passed in CI" cannot come to mean different
      # things.
      - name: Preflight
        run: npm run preflight:full
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
